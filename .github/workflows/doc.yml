name: Generate documents

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    name: Generate documents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Generate from the latest main when a queued run starts.
          ref: main
      - name: Generating documents
        uses: obaland/panvimdoc@main
        with:
          vimdoc: vfiler
          description: File manager plugin for Vim/Neovim
          pandoc: doc/vfiler.md
          toc: true
      - name: Commit changes
        env:
          COMMIT_MSG: |
            docs: update doc/vfiler.txt

            skip-checks: true
        run: |
          git add doc/vfiler.txt
          if git diff --cached --quiet -- doc/vfiler.txt; then
            echo "No document changes to commit."
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "$COMMIT_MSG"
          git pull --rebase origin main
          git push origin HEAD:main
